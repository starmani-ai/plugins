# Merge this section into ~/.codex/config.toml; do not overwrite existing config.
# Then run: codex mcp login starmani   (opens starmani.com to sign in and approve)
[mcp_servers.starmani]
url = "https://api.starmani.com/mcp"

# Prefer an API key? Add this line instead of signing in, and set STARMANI_API_KEY
# in the environment of the process running Codex:
# bearer_token_env_var = "STARMANI_API_KEY"
